<body data-page-node-id="BUYVOTM1MzBsITJkssKcaA">
<div class="wrap" data-page-node-id="b1U0VwY1jsswX3IGRBwJ54">
  <h1 data-page-node-id="a9FKZhz7sbGCSUHD7JNiJN">灵境 · 真实世界：经验驱动物理层</h1>
  <div class="sub" data-page-node-id="U80WzEtTZouWFQwJoQZXdL">同一初值下三个世界各跑各的中心律：<b data-page-node-id="CJFT1lCCYGGL75HgUNqFo9">真实</b>（含 1/r³ 修正）／<b data-page-node-id="tnhxrgRE5QfPNMaYldHSqo">经验</b>（从真实轨迹学出的律，SINDy）／<b data-page-node-id="jAwMylkgaPWPTOCNwPOAvD">设计</b>（硬写 GM=1000，漏掉了真实里的 1/r³ 修正）。看轨道：经验贴着真实跑，设计随圈数明显甩开。全部实算（速度 Verlet）。</div>
  <canvas id="cv" width="640" height="640" data-page-node-id="Bgzn0rKHxAV4E8RidTQMcw"></canvas>
  <div class="row" data-page-node-id="B9KQy7iRvsA11q3yrMnnZ2">
    <button id="btnPlay" class="primary" data-page-node-id="b6b5YQlJv8Sm9Kl9AeZrEb">⏸ 暂停</button>
    <button id="btnReset" data-page-node-id="Jc8CFep9kEkzmCuRHUFyD2">↺ 重置</button>
    <span class="lg" style="margin-left:auto" data-page-node-id="a24WXx8vfSOOrbQrFjOOL5">
      <span data-page-node-id="o0fbGaDWcjB6xOsFgGBKUt"><i style="background:#9ad0ff" data-page-node-id="8r6bVd5T4bI1wFAdWuAC5b"></i>真实</span>
      <span data-page-node-id="rN46BtV9aVHHkOa1svWBPJ"><i style="background:#6fe3a0" data-page-node-id="D3IoWixrQgQcF0Bg6nCDBB"></i>经验（学出律）</span>
      <span data-page-node-id="R1ChDv8BaqMYnyQlfxsdl2"><i style="background:#ff8f8f" data-page-node-id="R25o278ehLjyjBCg4cGXXh"></i>设计（硬写 GM）</span>
    </span>
  </div>
  <div class="note" data-page-node-id="Rt1gxQKd9zld4Xw0KVdwTH">诚实边界：经验律短程贴合真实、长程会相位累积漂移 → 经验需持续被真实数据校正（v2 闭环）；本页"真实"仍为设定律的合成世界，传感器桥与自模型未含。</div>

  <script src="rom.js"></script>
  <script>
    (function () {
      var R = window.LingJingROM;
      if (!R || !R.RealWorld3D) { document.body.innerHTML = '<p style="padding:40px">rom.js 未加载：请把 world3d.html 与 rom.js 放在同一目录。</p>'; return; }
      var RW = R.RealWorld3D;
      var cv = document.getElementById('cv'), play = document.getElementById('btnPlay'), reset = document.getElementById('btnReset');
      var DT = 0.01, TRAIL = 1400, S = 30, C = 640;
      var LAWS = { truth: [-1000, 0, 0, 600], exp: [-1000.36, 0, 0, 603.06], design: [-1000, 0, 0, 0] };
      var COLOR = { truth: '#9ad0ff', exp: '#6fe3a0', design: '#ff8f8f' };
      var KEYS = ['truth', 'exp', 'design'];
      var worlds = [], trails = [], timer = null, running = true;

      function build() {
        if (timer) { clearInterval(timer); timer = null; }
        worlds = []; trails = [];
        KEYS.forEach(function (k) {
          var w = new RW({ centralLaw: LAWS[k], rMin: 0.5 });
          w.addBody([10, 0, 0], [0, 8, 0], 1.0);   // 同一初值：椭圆轨道
          worlds.push(w);
          trails.push(w.bodies.map(function () { return []; }));
        });
        render();
      }

      function advance() {
        var sub = 80;                                // 每帧 0.8 时间单位（≈0.2 圈）
        for (var k = 0; k < worlds.length; k++) {
          var w = worlds[k], tr = trails[k];
          for (var s = 0; s < sub; s++) {
            w.step(DT);
            if (s % 8 === 0) for (var i = 0; i < w.bodies.length; i++) {
              tr[i].push(w.bodies[i].pos.slice());
              if (tr[i].length > TRAIL) tr[i].shift();
            }
          }
        }
        render();
      }

      function render() {
        var cx = C / 2, cy = C / 2, g = cv.getContext('2d');
        g.fillStyle = '#0d1117'; g.fillRect(0, 0, C, C);
        g.strokeStyle = 'rgba(255,255,255,0.07)';
        [5, 10, 15].forEach(function (rr) { g.beginPath(); g.arc(cx, cy, rr * S, 0, 6.2832); g.stroke(); });
        g.strokeStyle = 'rgba(255,255,255,0.10)';
        g.beginPath(); g.moveTo(cx, 0); g.lineTo(cx, C); g.stroke();
        g.beginPath(); g.moveTo(0, cy); g.lineTo(C, cy); g.stroke();
        g.fillStyle = '#e8c46a'; g.beginPath(); g.arc(cx, cy, 7, 0, 6.2832); g.fill();
        for (var k = 0; k < worlds.length; k++) {
          var w = worlds[k], tr = trails[k], col = COLOR[KEYS[k]];
          for (var i = 0; i < w.bodies.length; i++) {
            var p = w.bodies[i].pos;
            g.strokeStyle = col; g.lineWidth = 1.5; g.beginPath();
            var first = true;
            for (var t = 0; t < tr[i].length; t++) {
              var q = tr[i][t], sx = cx + q[0] * S, sy = cy - q[1] * S;
              if (sx < -20 || sx > C + 20 || sy < -20 || sy > C + 20) { first = true; continue; }
              if (first) { g.moveTo(sx, sy); first = false; } else g.lineTo(sx, sy);
            }
            g.stroke();
            g.fillStyle = col;
            g.beginPath(); g.arc(cx + p[0] * S, cy - p[1] * S, 5, 0, 6.2832); g.fill();
          }
        }
      }

      play.addEventListener('click', function () {
        if (running) { clearInterval(timer); timer = null; running = false; this.textContent = '▶ 播放'; }
        else { timer = setInterval(advance, 90); running = true; this.textContent = '⏸ 暂停'; }
      });
      reset.addEventListener('click', function () {
        build();
        if (!running) play.click();                  // 重置后若停在暂停态则继续播放
      });

      build();
      timer = setInterval(advance, 90);              // 打开即自动播放
    })();
  </script>
</div>
